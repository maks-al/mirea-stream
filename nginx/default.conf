# Nginx serves only web/signalling traffic. JVB audio/video uses UDP/10000 directly.
# Docker embedded DNS: resolve the Jitsi service at request time, not Nginx startup.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name mirea.stream;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mirea.stream;
    ssl_certificate     /etc/letsencrypt/live/mirea.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirea.stream/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    set $jitsi_backend web:8000;
    client_max_body_size 20m;

    # Change for the CI/CD demonstration, e.g. v1 -> v2.
    add_header X-Mirea-Release "v3-brand" always;

    # Brand assets are shipped with our Nginx image, not copied into Jitsi.
    location ^~ /brand/ {
        alias /usr/share/nginx/html/brand/;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/brand/favicon.ico;
    }

    location = /images/favicon.ico {
        alias /usr/share/nginx/html/brand/favicon.ico;
    }

    # Override the existing Jitsi welcome picture, preserving page markup.
    location = /images/welcome-background.png {
        alias /usr/share/nginx/html/brand/welcome-background.png;
    }

    location /xmpp-websocket {
        proxy_pass http://$jitsi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://$jitsi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
